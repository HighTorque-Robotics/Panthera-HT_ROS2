# joint_limits.yaml allows the dynamics properties specified in the URDF to be overwritten or augmented as needed

# For beginners, we downscale velocity and acceleration limits.
# You can always specify higher scaling factors (<= 1.0) in your motion requests.
# Increase the values below to 1.0 to move at the configured maximum speed.
#
# MoveIt Lyrical's AddTimeOptimalParameterization adapter requires a positive
# acceleration limit for every planned joint. Keep a conservative 2 rad/s^2
# ceiling here; the default 0.5 scaling below plans at no more than 1 rad/s^2.
default_velocity_scaling_factor: 0.5
default_acceleration_scaling_factor: 0.5

# Specific joint properties can be changed with the keys [max_position, min_position, max_velocity, max_acceleration]
# Joint limits can be turned off with [has_velocity_limits, has_acceleration_limits]
joint_limits:
  joint1:
    has_velocity_limits: true
    max_velocity: 4.2000000000000002
    has_acceleration_limits: true
    max_acceleration: 2.0
  joint2:
    # Match the hardware profile's -0.01 rad lower tolerance. The encoder can
    # report a small negative value while the joint is physically at zero.
    min_position: -0.01
    has_velocity_limits: true
    max_velocity: 5.0
    has_acceleration_limits: true
    max_acceleration: 2.0
  joint3:
    # Match the hardware profile's -0.01 rad lower tolerance.
    min_position: -0.01
    has_velocity_limits: true
    max_velocity: 5.0
    has_acceleration_limits: true
    max_acceleration: 2.0
  joint4:
    has_velocity_limits: true
    max_velocity: 4.2000000000000002
    has_acceleration_limits: true
    max_acceleration: 2.0
  joint5:
    has_velocity_limits: true
    max_velocity: 3.7000000000000002
    has_acceleration_limits: true
    max_acceleration: 2.0
  joint6:
    has_velocity_limits: true
    max_velocity: 3.7000000000000002
    has_acceleration_limits: true
    max_acceleration: 2.0
  L_finger_joint:
    has_velocity_limits: true
    max_velocity: 0.1
    has_acceleration_limits: true
    max_acceleration: 0.04
